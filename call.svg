<text class="mut" x="26" y="490" fill="#898781" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,sans-serif" font-size="10.5" font-weight="400" text-anchor="start">left: the shaded area is C(K_atm) = int_K^inf D(u) du, ruled at every strike into the dK columns it is</text>
<text class="mut" x="26" y="507" fill="#898781" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,sans-serif" font-size="10.5" font-weight="400" text-anchor="start">summed from. The staircase above the curve is the left-hand sum (call_hi), the one below it the</text>
<text class="mut" x="26" y="524" fill="#898781" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,sans-serif" font-size="10.5" font-weight="400" text-anchor="start">right-hand sum (call_lo)</text>
<text class="mut" x="26" y="541" fill="#898781" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,sans-serif" font-size="10.5" font-weight="400" text-anchor="start">right: dK digitals struck at each K_i super-replicate the call; the same widths struck one strike up</text>
<text class="mut" x="26" y="558" fill="#898781" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,sans-serif" font-size="10.5" font-weight="400" text-anchor="start">sub-replicate it. The gap between them is the strike grid. Each slab is one digital's dK, and they stack</text>
<text class="mut" x="26" y="575" fill="#898781" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,sans-serif" font-size="10.5" font-weight="400" text-anchor="start">into the staircase you collect</text>
<text class="mut" x="26" y="592" fill="#898781" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,sans-serif" font-size="10.5" font-weight="400" text-anchor="start">past 64,750 the ladder stops: both stacks go flat, the payoff does not. That wedge is the tail model --</text>
<text class="mut" x="26" y="609" fill="#898781" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,sans-serif" font-size="10.5" font-weight="400" text-anchor="start">5.1% of this call's value</text>
<text class="mut" x="26" y="626" fill="#898781" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,sans-serif" font-size="10.5" font-weight="400" text-anchor="start">warning: dropped 74 of 80 threshold strikes pinned at the extreme tick; integrating their midpoints</text>
<text class="mut" x="26" y="643" fill="#898781" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,sans-serif" font-size="10.5" font-weight="400" text-anchor="start">would have added ~$93 to every call. The region beyond the live quotes is the tail model's job now</text>
