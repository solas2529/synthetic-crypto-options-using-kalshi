; Copy to config.ini and fill in.  config.ini and *.pem are gitignored.
[kalshi]
; Get these from your Kalshi profile -> API keys.  Kalshi shows the private key
; exactly once, at creation; save it next to this file as kalshi_private_key.pem.
;
; use_demo = true  -> demo-api.kalshi.co, paper trading
; use_demo = false -> api.elections.kalshi.com, your real account
;
; Only GET endpoints are ever called, so a key with read access is enough.
use_demo = true
api_key_id = 00000000-0000-0000-0000-000000000000
private_key_path = kalshi_private_key.pem
