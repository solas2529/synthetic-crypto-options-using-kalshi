<text class="mut" x="26" y="643" fill="#898781" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,sans-serif" font-size="10.5" font-weight="400" text-anchor="start">would have added ~$93 to every call. The region beyond the live quotes is the tail model's job now</text>
