<text class="mut" x="26" y="558" fill="#898781" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,sans-serif" font-size="10.5" font-weight="400" text-anchor="start">down sub-replicate it. The gap between them is the grid. Each slab is one digital's dK, and they stack</text>
<text class="mut" x="26" y="575" fill="#898781" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,sans-serif" font-size="10.5" font-weight="400" text-anchor="start">into the staircase you collect</text>
